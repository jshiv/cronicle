name: rebuild-infra

# When the cronicle runtime changes, trigger a rebuild on cronicle-infra so the
# cronicled image gets re-baked with the new runtime and rolled out.
#
# Required repo secrets:
#   CRONICLE_INFRA_DISPATCH_TOKEN - PAT with `repo` scope on cronicle-infra,
#                                   used to fire workflow_dispatch.
#
# Required repo variables:
#   CRONICLE_INFRA_REPO - owner/cronicle-infra (defaults to same org as this repo)

on:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"
  workflow_dispatch:

jobs:
  dispatch:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger cronicle-infra build-and-deploy
        env:
          GH_TOKEN: ${{ secrets.CRONICLE_INFRA_DISPATCH_TOKEN }}
          INFRA_REPO: ${{ vars.CRONICLE_INFRA_REPO || format('{0}/cronicle-infra', github.repository_owner) }}
        run: |
          gh workflow run release.yml \
            --repo "$INFRA_REPO" \
            --ref main
