name: ci

# PR-time validation: go vet + go test ./...
# Runs on every PR and on push to main (catches direct merges).
#
# gofmt is intentionally not enforced here — Go 1.26 reflows godoc lists
# differently than earlier versions, so re-enabling it requires a one-time
# `gofmt -w .` sweep first.

on:
  pull_request:
  push:
    branches: [main]
    paths-ignore:
      - "**/*.md"
      - "docs/**"

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  go:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true

      - name: go vet
        run: go vet ./...

      - name: go test
        run: go test -race -count=1 -timeout=5m ./...

      # Binary-level smoke tests. These build a race-instrumented
      # cronicle binary and exec it as a real subprocess against a
      # few stress fixtures (clean startup, rapid HCL mutations).
      # Catches scheduler races and shutdown bugs that the in-process
      # tests above can't reach because the goroutine interleaving
      # in a binary driving its own cron ticks differs from
      # Run() invoked directly from a test.
      #
      # Behind a `smoke` build tag so default `go test ./...` stays
      # fast and self-contained.
      - name: go test (smoke)
        run: go test -tags smoke -count=1 -timeout=5m ./...
